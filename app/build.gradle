plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mit.attendance'
    compileSdk 34

    // Secrets are loaded from a gitignored secrets.properties at the repo root.
    // Firebase configuration is optional; missing values keep push disabled.
    def secrets = new Properties()
    def secretsFile = rootProject.file("secrets.properties")
    if (secretsFile.exists()) {
        secrets.load(new FileInputStream(secretsFile))
    }
    def secretOrEmpty = { key -> secrets.getProperty(key, "") }

    defaultConfig {
        applicationId "com.mit.attendance"
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "1.1.0"

        // Firebase client identifiers are public app configuration, never service-account keys.
        ["FIREBASE_PROJECT_ID", "FIREBASE_APPLICATION_ID", "FIREBASE_API_KEY", "FIREBASE_SENDER_ID"].each { key ->
            buildConfigField "String", key, "\"${secretOrEmpty(key)}\""
        }


        python {
            buildPython "python3"
            version "3.12"
            pip {
                // The main package
                install "git+https://github.com/teng-lin/notebooklm-py.git"

                // Its required dependencies (explicitly declared)
                install "httpx[http2]"     // HTTP client used for all API calls
                install "anyio"            // async support
                install "h2"               // HTTP/2 support (needed by httpx[http2])
                install "dulwich==0.24.10"
                install "requests"

                // DO NOT add these:
                // install "playwright"    ← crashes on Android, not needed
                // install "chromium"      ← not needed
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        // Reuse the standard Android debug keystore so locally built release APKs
        // can be installed on a device for verification. Replace with a real
        // release keystore before publishing.
        debugSigned {
            storeFile = file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debugSigned
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
    
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
            pickFirsts += [
                'META-INF/services/javax.xml.stream.XMLInputFactory',
                'META-INF/services/javax.xml.stream.XMLOutputFactory',
                'META-INF/services/javax.xml.stream.XMLEventFactory',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }
}

kotlin {
    jvmToolchain(17)
}

